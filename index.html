<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Messages ♡</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- MESSAGE LIST SCREEN -->
  <div class="app-screen" id="homeScreen">

    <div class="app-header">
      <h1>Messages ♡</h1>
    </div>

    <div class="conversation" id="openChat">

      <div class="avatar">♡</div>

      <div class="conversation-info">
        <h2>Galak & Jendral</h2>
        <p>You have a special message... ♡</p>
      </div>

      <span class="arrow">›</span>

    </div>

  </div>


  <!-- CHAT ROOM -->
  <div class="container" id="chatScreen">

    <div class="header">
      <h1>Galak & Jendral ♡</h1>
      <p>our little story ♡</p>
    </div>

    <div class="chat-box" id="chatBox">

      <div class="message jendral">
        <span class="name">Jendral</span>

        <div class="bubble">
          Can I ask you something?
        </div>
      </div>

    </div>

    <button id="nextButton">Continue ♡</button>

    <button id="musicButton">🎵 Play Music</button>

  </div>


  <!-- MUSIC -->
  <audio id="music" loop>
    <source src="just the way you are.mp3" type="audio/mpeg">
  </audio>


  <script src="script.js"></script>

</body>
</html>
